<header class="topbar">
  <div>
    <div class="topbar__heading">Public Key Infrastructure</div>
    <div class="topbar__subheading">Secure certificate management system</div>
  </div>

  <div class="topbar__user">
    <div class="topbar__user-info">
      <div class="topbar__name">{{ fullName }}</div>
      <div class="topbar__meta">{{ roleLabel }} • {{ organization }}</div>
    </div>
    <div class="topbar__avatar">
      {{ fullName.charAt(0) || 'U' }}
    </div>
  </div>
</header>
