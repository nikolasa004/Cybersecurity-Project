<aside class="sidebar">
  <div class="sidebar__brand">
    <div class="sidebar__logo">PKI</div>
    <div>
      <div class="sidebar__title">{{ title }}</div>
      <div class="sidebar__subtitle">Management panel</div>
    </div>
  </div>

  <nav class="sidebar__nav">
    @for (item of items; track item.route) {
      <a class="sidebar__link" [routerLink]="item.route">
        {{ item.label }}
      </a>
    }
    <a class="sidebar__link" (click)="onLogout()">Logout</a>
  </nav>

</aside>

<app-confirm-dialog
  [isOpen]="showLogoutDialog"
  title="Log out"
  message="Are you sure you want to log out?"
  confirmText="Yes, log out"
  cancelText="Cancel"
  [danger]="true"
  (confirm)="confirmLogout()"
  (cancel)="closeLogoutDialog()"
></app-confirm-dialog>
