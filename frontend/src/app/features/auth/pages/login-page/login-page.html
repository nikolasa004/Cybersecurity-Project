<div class="login-container">
  <div class="login-card">
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      @if (!isMfaRequired) {
        <h2>Login</h2>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" class="form-control" placeholder="Enter email">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" class="form-control" placeholder="Enter password">
        </div>

        @if (errorMessage) {
          <p class="error-text">{{ errorMessage }}</p>
        }

        <button type="submit" [disabled]="loginForm.get('email')?.invalid || loginForm.get('password')?.invalid" class="btn-login">
          Login
        </button>

        <div class="auth-links" *ngIf="!isMfaRequired">
          <a routerLink="/auth/register">Create account</a>
          <a routerLink="/auth/forgot-password">Forgot password?</a>
        </div>
      } 
      
      @else {
        <h2>Two-Factor Authentication</h2>
        <p class="mfa-instruction-text">
          Your account is secured with 2FA. Please enter the 6-digit verification code from your Authenticator app.
        </p>

        <div class="form-group">
          <label>Verification Code</label>
          <input type="text" 
                 formControlName="mfaCode" 
                 class="form-control mfa-input-field" 
                 placeholder="000000" 
                 maxlength="6"
                 autocomplete="one-time-code">
        </div>

        @if (errorMessage) {
          <p class="error-text">{{ errorMessage }}</p>
        }

        <div class="mfa-action-buttons">
          <button type="button" class="btn-cancel-mfa" (click)="cancelMfa()">Back</button>
          <button type="submit" [disabled]="loginForm.get('mfaCode')?.invalid" class="btn-login btn-verify-mfa">
            Verify & Login
          </button>
        </div>
      }

    </form>
  </div>
</div>
